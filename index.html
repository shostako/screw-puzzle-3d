<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9fd3ff">
<title>ねじ外しパズル 3D</title>
<link rel="icon" href="data:,">
<link rel="preload" href="./src/assets/fonts/rounded-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<!-- 起動の画面（E3）: JS と物理の wasm を読む間に出す。初めて開いた時はそのままタイトルになり「はじめる」を待つ（src/boot.js） -->
<div id="boot">
  <div class="boot-card">
    <div class="boot-art">
      <img class="boot-idle" src="./src/assets/nejimaru.webp" alt="" width="301" height="420">
      <img class="boot-jump" src="./src/assets/nejimaru-jump.webp" alt="" width="346" height="420">
    </div>
    <h1 class="boot-logo" aria-label="ねじ外しパズル 3D"><span class="bl-main">ねじ外し</span><span class="bl-sub">パズル<b>3D</b></span></h1>
    <div id="boot-bar" role="progressbar" aria-label="読み込み" aria-valuemin="0" aria-valuemax="100"><i></i></div>
    <p class="boot-tag">立体を回して、ねじを ぜんぶ 外そう</p>
    <button id="boot-start" type="button" hidden>はじめる</button>
  </div>
</div>
<!-- 普段の画面の背景（F2、src/backdrop.js）: 空の奥のおもちゃの町並み（遠近の2列）、流れる雲、昇る粒、マットと影。盤面のキャンバスの後ろ -->
<div id="backdrop" aria-hidden="true">
  <svg width="0" height="0" style="position:absolute">
    <symbol id="bd-town-near" viewBox="0 0 480 96">
      <g class="t1"><rect x="10" y="54" width="64" height="42" rx="7"/><rect x="20" y="47" width="14" height="9" rx="3"/><rect x="50" y="47" width="14" height="9" rx="3"/></g>
      <g class="t2"><rect x="86" y="24" width="34" height="72" rx="6"/><circle cx="103" cy="25" r="17"/></g>
      <g class="t3"><rect x="134" y="56" width="58" height="40" rx="6"/><path d="M131 60 163 30 195 60Z" stroke-width="8" stroke-linejoin="round"/></g>
      <g class="t4"><rect x="206" y="66" width="50" height="30" rx="6"/><rect x="214" y="38" width="34" height="30" rx="6"/><rect x="219" y="31" width="10" height="9" rx="3"/><rect x="233" y="31" width="10" height="9" rx="3"/></g>
      <g class="t5"><path d="M268 96V58a6 6 0 0 1 6-6h60a6 6 0 0 1 6 6v38h-20a16 16 0 0 0-32 0Z"/></g>
      <g class="t2"><rect x="352" y="38" width="36" height="58" rx="4"/><ellipse cx="370" cy="38" rx="18" ry="6"/></g>
      <g class="t1"><rect x="398" y="66" width="30" height="30" rx="5"/><rect x="407" y="59" width="12" height="9" rx="3"/></g>
      <g class="t3"><circle cx="456" cy="46" r="19"/><rect x="452" y="60" width="8" height="36" rx="3"/></g>
    </symbol>
    <symbol id="bd-town-far" viewBox="0 0 360 72">
      <rect x="6" y="34" width="40" height="38" rx="5"/><rect x="52" y="18" width="26" height="54" rx="5"/><path d="M50 22 65 4 80 22Z" stroke-width="6" stroke-linejoin="round"/>
      <rect x="86" y="44" width="54" height="28" rx="5"/><rect x="96" y="38" width="10" height="8" rx="2"/><rect x="120" y="38" width="10" height="8" rx="2"/>
      <circle cx="166" cy="40" r="20"/><rect x="146" y="40" width="40" height="32"/>
      <rect x="196" y="28" width="30" height="44" rx="5"/><rect x="232" y="50" width="44" height="22" rx="5"/>
      <rect x="284" y="14" width="22" height="58" rx="4"/><ellipse cx="295" cy="14" rx="11" ry="4"/><rect x="312" y="40" width="42" height="32" rx="5"/>
    </symbol>
    <symbol id="bd-cloud" viewBox="0 0 120 52">
      <circle cx="34" cy="32" r="18"/><circle cx="60" cy="24" r="22"/><circle cx="88" cy="32" r="16"/><rect x="14" y="30" width="92" height="22" rx="11"/>
    </symbol>
  </svg>
  <div class="bd-clouds"><svg class="bd-cloud c1"><use href="#bd-cloud"/></svg><svg class="bd-cloud c2"><use href="#bd-cloud"/></svg><svg class="bd-cloud c3"><use href="#bd-cloud"/></svg></div>
  <div class="bd-town far"><svg id="bd-far" width="2160" height="72"><use href="#bd-town-far" width="360" height="72"/><use href="#bd-town-far" x=360 width="360" height="72"/><use href="#bd-town-far" x=720 width="360" height="72"/><use href="#bd-town-far" x=1080 width="360" height="72"/><use href="#bd-town-far" x=1440 width="360" height="72"/><use href="#bd-town-far" x=1800 width="360" height="72"/></svg></div>
  <div class="bd-town near"><svg id="bd-near" width="2400" height="96"><use href="#bd-town-near" width="480" height="96"/><use href="#bd-town-near" x=480 width="480" height="96"/><use href="#bd-town-near" x=960 width="480" height="96"/><use href="#bd-town-near" x=1440 width="480" height="96"/><use href="#bd-town-near" x=1920 width="480" height="96"/></svg></div>
  <div class="bd-floor"></div>
  <div class="bd-ground"></div>
  <div class="bd-dots"><span style="--x:2.9%;--s:6px;--d:22s;--delay:-14.3s;--sway:-24px"></span><span style="--x:18.3%;--s:5px;--d:22s;--delay:-9.2s;--sway:-16px"></span><span style="--x:25.5%;--s:8px;--d:16s;--delay:-13.2s;--sway:-24px"></span><span style="--x:44.5%;--s:8px;--d:16s;--delay:-15.6s;--sway:-24px"></span><span style="--x:52.3%;--s:6px;--d:20s;--delay:-8.4s;--sway:16px"></span><span style="--x:65.6%;--s:10px;--d:26s;--delay:-4.9s;--sway:-24px"></span><span style="--x:76.3%;--s:5px;--d:25s;--delay:-1.5s;--sway:-16px"></span><span style="--x:92.5%;--s:8px;--d:21s;--delay:-6.3s;--sway:-16px"></span></div>
</div>
<canvas id="stage"></canvas>
<header id="hud">
  <div id="bar">
    <span id="progress"></span>
    <h1><button id="mode-btn" type="button" aria-label="遊び方を選ぶ"><span id="title">ねじ外しパズル 3D</span><span id="subtitle" hidden></span></button></h1>
    <button id="restart" type="button" aria-label="やり直す">↻</button>
  </div>
  <div id="boxes"></div>
  <div id="slots"></div>
  <p id="hint"></p>
</header>
<nav id="tools">
  <button id="undo" type="button" aria-label="1手戻す" title="1手戻す" disabled>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>
  <button id="hint-btn" type="button" aria-label="ヒント" title="ヒント">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5h6M10 20.5h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>
  </button>
  <button id="home" type="button" aria-label="向きを戻す" title="向きを戻す">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 0v0M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
  </button>
  <button id="sound" type="button" aria-label="音を切る" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="m16 9.5 5 5m0-5-5 5"/></svg>
  </button>
</nav>
<canvas id="mascot" aria-hidden="true"></canvas>
<!-- 初めての導入（E4）: ネジまるの吹き出しと、手本の半透明の手（src/tutorial.js が何をいつ出すかを決める） -->
<p id="coach" role="status" hidden></p>
<div id="coach-hand" aria-hidden="true" hidden>
  <i class="ripple"></i>
  <svg viewBox="0 0 48 56"><path d="M12 30V8a5 5 0 0 1 10 0v14.5a4.5 4.5 0 0 1 9 1.5a4.5 4.5 0 0 1 9 3V40c0 7-5 12-12 12h-7c-4 0-7-2-9-5l-7-9c-2-2.5-1.5-6 1-7.5c2-1.2 4.5-.8 6 1z"/><path class="crease" d="M22 22.5v6M31 24v5"/></svg>
</div>
<div id="flyers"></div>
<div id="rain"></div>
<div id="overlay" hidden>
  <div class="card">
    <h2 id="end-title"></h2>
    <p id="end-text"></p>
    <div id="end-stars" role="img" hidden></div>
    <p id="end-score" hidden></p>
    <div id="end-chapter" hidden></div>
    <button id="next" type="button" hidden>次のステージへ</button>
    <div id="end-help">
      <button id="rewind" class="big" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
        <b>戻る</b><small>解ける所まで</small>
      </button>
      <button id="end-hint" class="big" type="button" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5h6M10 20.5h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg>
        <b>ヒント</b><small>戻って次の一手</small>
      </button>
    </div>
    <button id="back1" class="sub" type="button" hidden>1手戻す</button>
    <button id="resume" class="sub" type="button" hidden>このまま続ける</button>
    <button id="again" type="button">もう一度</button>
  </div>
</div>
<div id="menu" hidden>
  <div class="card">
    <h2>遊び方</h2>
    <button id="m-stage" class="pick" type="button"><b>ステージ</b><small id="m-stage-sub"></small></button>
    <button id="m-daily" class="pick" type="button"><b>今日の1問</b><small id="m-daily-sub"></small></button>
    <p class="m-head">おまかせ（毎回ちがう1問）</p>
    <div class="m-diffs">
      <button id="m-easy" type="button">やさしい</button>
      <button id="m-normal" type="button">ふつう</button>
      <button id="m-hard" type="button">むずかしい</button>
    </div>
    <button id="m-settings" class="sub" type="button">⚙ 設定</button>
    <button id="m-close" class="sub" type="button">閉じる</button>
  </div>
</div>
<div id="stages" hidden>
  <div class="card">
    <h2>ステージ</h2>
    <p id="st-total"></p>
    <button id="st-continue" class="pick" type="button"><b>続きから</b><small id="st-continue-sub"></small></button>
    <div id="st-list"></div>
    <button id="st-close" class="sub" type="button">もどる</button>
  </div>
</div>
<div id="settings" hidden>
  <div class="card">
    <h2>設定</h2>
    <div class="s-row"><span>音</span><div class="seg" data-key="sound" role="group" aria-label="音"><button type="button" data-v="true">入</button><button type="button" data-v="false">切</button></div></div>
    <div class="s-row"><span>BGM</span><div class="seg" data-key="bgm" role="group" aria-label="BGM"><button type="button" data-v="true">入</button><button type="button" data-v="false">切</button></div></div>
    <div class="s-row"><span>振動</span><div class="seg" data-key="vibrate" role="group" aria-label="振動"><button type="button" data-v="true">入</button><button type="button" data-v="false">切</button></div></div>
    <div class="s-row"><span>回す速さ</span><div class="seg" data-key="speed" role="group" aria-label="回す速さ"><button type="button" data-v="slow">ゆっくり</button><button type="button" data-v="normal">ふつう</button><button type="button" data-v="fast">はやい</button></div></div>
    <div class="s-row"><span>画質</span><div class="seg" data-key="quality" role="group" aria-label="画質"><button type="button" data-v="auto">自動</button><button type="button" data-v="light">軽い</button></div></div>
    <p class="s-note">動きが重いときは「軽い」に</p>
    <div class="s-row"><span>ねじ穴の形</span><div class="seg" data-key="drives" role="group" aria-label="ねじ穴の形"><button type="button" data-v="false">六角</button><button type="button" data-v="true">色ごと</button></div></div>
    <p class="s-note">「色ごと」にすると、色を形でも見分けられます</p>
    <div class="s-row"><span>ネジまる</span><div class="seg" data-key="mascot" role="group" aria-label="ネジまる"><button type="button" data-v="true">出す</button><button type="button" data-v="false">隠す</button></div></div>
    <button id="s-clear" type="button">記録を消す</button>
    <p class="s-note">到達したステージと自己ベスト、遊び方の案内を消します</p>
    <button id="s-close" class="sub" type="button">もどる</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
