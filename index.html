<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4ead9">
<title>ねじ外しパズル 3D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="stage"></canvas>
<header id="hud">
  <div id="bar">
    <span id="progress"></span>
    <h1 id="title">ねじ外しパズル 3D</h1>
    <button id="restart" type="button" aria-label="やり直す">↻</button>
  </div>
  <div id="boxes"></div>
  <div id="slots"></div>
  <p id="hint">1本指で回す・ねじをタップで外す</p>
</header>
<nav id="tools">
  <button id="home" type="button" aria-label="向きを戻す" title="向きを戻す">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9L12 3Zm0 0v0M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>
  </button>
  <button id="sound" type="button" aria-label="音と振動を切る" aria-pressed="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" d="m16 9.5 5 5m0-5-5 5"/></svg>
  </button>
</nav>
<div id="flyers"></div>
<div id="overlay" hidden>
  <div class="card">
    <h2 id="end-title"></h2>
    <p id="end-text"></p>
    <button id="next" type="button" hidden>次のステージへ</button>
    <button id="again" type="button">もう一度</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
