<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4ead9">
<title>ねじ外しパズル 3D</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<canvas id="stage"></canvas>
<header id="hud">
  <div id="bar">
    <span id="progress"></span>
    <h1 id="title">ねじ外しパズル 3D</h1>
    <button id="restart" type="button" aria-label="やり直す">↻</button>
  </div>
  <div id="boxes"></div>
  <div id="slots"></div>
  <p id="hint">1本指で回す・ねじをタップで外す</p>
</header>
<div id="flyers"></div>
<div id="overlay" hidden>
  <div class="card">
    <h2 id="end-title"></h2>
    <p id="end-text"></p>
    <button id="next" type="button" hidden>次のステージへ</button>
    <button id="again" type="button">もう一度</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
